name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      verified_ci_run_id:
        description: Successful Android CI run ID for this exact source commit
        required: true
      version_code:
        description: Google Play version code, larger than every previous upload
        required: true
        default: '1'
      version_name:
        description: Public app version
        required: true
        default: '1.0.0'

permissions:
  contents: read
  actions: read

concurrency:
  group: home-session-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Verify prior CI, sign and verify APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: write
      actions: read
    env:
      HOME_SESSION_YANDEX_BANNER_ID: ${{ vars.HOME_SESSION_YANDEX_BANNER_ID }}
      HOME_SESSION_KEYSTORE_PASSWORD: ${{ secrets.HOME_SESSION_KEYSTORE_PASSWORD }}
      HOME_SESSION_KEY_ALIAS: ${{ secrets.HOME_SESSION_KEY_ALIAS }}
      HOME_SESSION_KEY_PASSWORD: ${{ secrets.HOME_SESSION_KEY_PASSWORD }}
      HOME_SESSION_VERSION_CODE: ${{ inputs.version_code }}
      HOME_SESSION_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require completed quality gates for the current source commit
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_SESSION_CI_RUN_ID: ${{ inputs.verified_ci_run_id }}
        run: python3 scripts/verify-ci-run.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up Android SDK and API 36 build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Set the ephemeral upload key path
        run: printf 'HOME_SESSION_KEYSTORE_FILE=%s/home-session-upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Load the protected Home Session upload key
        env:
          HOME_SESSION_KEYSTORE_BASE64: ${{ secrets.HOME_SESSION_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HOME_SESSION_KEYSTORE_BASE64"
          test -n "$HOME_SESSION_KEYSTORE_PASSWORD"
          test -n "$HOME_SESSION_KEY_ALIAS"
          test -n "$HOME_SESSION_KEY_PASSWORD"
          [[ "$HOME_SESSION_YANDEX_BANNER_ID" =~ ^R-M-[0-9]+-[0-9]+$ ]]
          [[ "$HOME_SESSION_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$HOME_SESSION_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          umask 077
          printf '%s' "$HOME_SESSION_KEYSTORE_BASE64" | base64 --decode > "$HOME_SESSION_KEYSTORE_FILE"
      - name: Build signed APK and Play bundle and check release lint
        run: ./gradlew --no-daemon --max-workers=2 :app:lintRelease :app:assembleRelease :app:bundleRelease -PversionCode="$HOME_SESSION_VERSION_CODE" -PversionName="$HOME_SESSION_VERSION_NAME"
      - name: Validate signatures, manifest and 16 KB page alignment
        run: bash scripts/verify-release.sh
      - name: Save verified release and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            release-output/
            app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified downloadable release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${HOME_SESSION_VERSION_NAME}-${HOME_SESSION_VERSION_CODE}" release-output/* --target "$GITHUB_SHA" --title "Home Session ${HOME_SESSION_VERSION_NAME} (${HOME_SESSION_VERSION_CODE})" --prerelease --notes-file scripts/release-notes.md
      - name: Remove the ephemeral key
        if: always()
        run: |
          if [ -n "${HOME_SESSION_KEYSTORE_FILE:-}" ]; then
            rm -f "$HOME_SESSION_KEYSTORE_FILE"
          fi
